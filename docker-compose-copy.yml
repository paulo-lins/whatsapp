version: '3.8'

services:
  web:
    build:
      context: ./worker_python
      dockerfile: Dockerfile
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./worker_python:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - GROQ_API_KEY=sua chave aqui
      - DATABASE_URL=postgresql://postgres:password123@host.docker.internal:5432/triagem_juridica
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./worker_python
      dockerfile: Dockerfile
    command: celery -A src.workers.tasks.celery_app worker --pool=solo --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - GROQ_API_KEY=sua chave aqui
      - DATABASE_URL=postgresql://postgres:password123@host.docker.internal:5432/triagem_juridica
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"