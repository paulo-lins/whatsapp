<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador WhatsApp - IA Jurídica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilização da barra de rolagem para ficar mais limpa */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-6 font-sans antialiased">

    <!-- ===================================== -->
    <!-- CONTAINER DO IPHONE (Frame Externo) -->
    <!-- ===================================== -->
    <div class="relative w-[375px] h-[812px] bg-black rounded-[56px] shadow-2xl border-4 border-gray-900 overflow-hidden">
        
        <!-- Notch do iPhone -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[160px] h-[30px] bg-black rounded-b-[20px] z-50 flex items-center justify-center px-4">
            <div class="w-16 h-1 bg-gray-800 rounded-full"></div>
            <div class="w-2 h-2 bg-gray-900 rounded-full ml-2 border border-gray-700"></div>
        </div>

        <!-- ===================================== -->
        <!-- TELA DO IPHONE (Conteúdo do App) -->
        <!-- ===================================== -->
        <div class="relative w-full h-full bg-[#E7E6E0] flex flex-col text-gray-900 pt-[30px]">

            <!-- 1. CABEÇALHO DO WHATSAPP -->
            <header class="bg-[#128C7E] text-white p-4 pt-6 shadow-md flex items-center space-x-3 z-10">
                <!-- Botão Voltar (Fake) -->
                <svg class="w-6 h-6 -ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                
                <!-- Foto de Perfil (Fake) -->
                <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center font-bold text-xl text-[#128C7E]">IA</div>
                
                <div class="flex-1">
                    <h1 class="font-semibold text-lg leading-tight">Assistente Jurídico IA</h1>
                    <p class="text-xs text-green-100 opacity-90">Online</p>
                </div>
                
                <!-- Ícones (Fake) -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.718 21 3 14.282 3 6V5z"></path></svg>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
            </header>

            <!-- 2. ÁREA DE MENSAGENS (Fundo de parede padrão) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded27.png')] bg-repeat opacity-90">
                
                <!-- Mensagem Inicial do Bot -->
                <div class="flex justify-start">
                    <div class="bg-white p-3 rounded-2xl rounded-bl-none shadow-sm max-w-[280px] text-[15px] relative">
                        Olá. Descreva o seu caso juridicamente para que eu possa fazer a triagem inicial.
                        <span class="absolute -bottom-1 -left-2 w-3 h-3 bg-white triangle-bot"></span>
                        <span class="text-[10px] text-gray-400 float-right mt-2 ml-2">09:30</span>
                    </div>
                </div>
                
                <!-- Onde as mensagens novas aparecerão -->
            </div>

            <!-- 3. CAMPO DE INPUT (Estilo iOS) -->
            <footer class="bg-[#F0F0F0] p-2 flex items-center space-x-2 border-t border-gray-300">
                <!-- Botão Anexo (Fake) -->
                <button class="text-gray-500 p-1">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.414 6.586a6 6 0 108.486 8.486L19 7"></path></svg>
                </button>
                
                <!-- Campo de Texto -->
                <form id="chat-form" class="flex-1 flex items-center bg-white rounded-full border border-gray-300 px-3 py-1.5 focus-within:ring-1 focus-within:ring-[#128C7E]">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Mensagem" 
                        class="flex-1 text-[17px] outline-none bg-transparent"
                        autocomplete="off"
                        required
                    >
                    <!-- Botão Emoji (Fake) -->
                    <button type="button" class="text-gray-500 p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                </form>

                <!-- Botão Enviar -->
                <button form="chat-form" type="submit" class="bg-[#128C7E] text-white p-2.5 rounded-full hover:bg-[#0f7569] transition duration-150">
                    <svg class="w-6 h-6 transform rotate-90 -mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </footer>
        </div>

        <!-- Barra Home do iPhone -->
        <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-[134px] h-[5px] bg-black rounded-full z-50"></div>
    </div>

    <!-- ===================================== -->
    <!-- LÓGICA JS DE COMUNICAÇÃO -->
    <!-- ===================================== -->
    <!-- ===================================== -->
    <!-- LÓGICA JS DE COMUNICAÇÃO -->
    <!-- ===================================== -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const inputField = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = inputField.value.trim();
            if (!message) return;

            // 1. Exibe a mensagem do usuário na tela (Balão Verde)
            adicionarMensagem(message, 'user');
            inputField.value = '';

            // 2. Chama a API FastAPI enviando os dados compatíveis com o backend
            try {
                const response = await fetch('http://127.0.0.1:8000/webhook/whatsapp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message_body: message,
                        from: "5585999999999",
                        entry: [{
                            changes: [{
                                value: {
                                    messages: [{
                                        from: "5585999999999",
                                        text: { body: message }
                                    }]
                                }
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                // Exibe a resposta real retornada pelo backend
                const iaResponse = data.mensagem || data.response || "Mensagem enviada com sucesso para triagem!";
                adicionarMensagem(iaResponse, 'bot');

            } catch (error) {
                console.error("Erro:", error);
                adicionarMensagem("Erro de conexão com o FastAPI.", 'error');
            }
        });

        function adicionarMensagem(text, sender) {
            const msgDiv = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            if (sender === 'user') {
                msgDiv.className = 'flex justify-end animate-fadeIn';
                msgDiv.innerHTML = `
                    <div class="bg-[#DCF8C6] p-3 px-4 rounded-2xl rounded-br-none shadow-sm max-w-[280px] text-[15px] relative">
                        ${text}
                        <span class="absolute -bottom-1 -right-2 w-3 h-3 bg-[#DCF8C6] triangle-user"></span>
                        <span class="text-[10px] text-gray-500 opacity-70 float-right mt-2 ml-2">${timestamp}</span>
                    </div>
                `;
            } else {
                const bgColor = sender === 'error' ? 'bg-red-100 text-red-700' : 'bg-white';
                msgDiv.className = 'flex justify-start animate-fadeIn';
                msgDiv.innerHTML = `
                    <div class="${bgColor} p-3 px-4 rounded-2xl rounded-bl-none shadow-sm max-w-[280px] text-[15px] relative">
                        ${text}
                        <span class="absolute -bottom-1 -left-2 w-3 h-3 ${bgColor} triangle-bot"></span>
                        <span class="text-[10px] text-gray-400 float-right mt-2 ml-2">${timestamp}</span>
                    </div>
                `;
            }
            
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>

    <!-- Estilos Groovy para as setas dos balões -->
    <style>
        .triangle-bot {
            clip-path: polygon(100% 0, 0 0, 0 100%);
        }
        .triangle-user {
            clip-path: polygon(100% 0, 0 0, 100% 100%);
        }
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
